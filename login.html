<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MinKatt - logga in</title>

    <link rel="stylesheet" href="styles.css">
    <script defer src="login.js"></script>
</head>

<body>

    <header>
        <div class="container">
            <div class="logo">
                <a href="/">MinKatt</a>
            </div>

            <nav class="nav">
                <a href="index.html">Hem</a>
                <a href="register.html">Registrera</a>
                <a href="login.html">Logga in</a>
                <a href="dashboard.html">Se katt</a>
            </nav>
        </div>

    </header>

    <main>
        <div class="container">
            <section>
                <h1>Logga in</h1>
                <p>Exempel finns med 'demo' eller 'test' som både namn och lösenord.</p>
                <form id="loginForm">

                    <div class="col">
                        <label for="username">Användarnamn</label>
                        <input type="text" id="username" required>
                    </div>
                    
                    <div class="col">
                        <label for="password">Lösenord</label>
                        <input type="password" id="password" required>
                    </div>

                    <button type="submit">Logga in</button>

                </form>

                <p id="message"></p>
            </section>
        </div>
    </main>

</body>

</html>
